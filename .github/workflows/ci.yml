name: Verify VIPER
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-runtime.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest --cov=src --cov=dashboard --cov-report=xml --cov-report=term
      - run: python main.py --config config/config.example.yaml --dry-run
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check dashboard/static/vision.js
      - run: node --test tests/dashboard.test.cjs
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --no-deps --disable-pip -r requirements-runtime.lock
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable build-context secret canaries
        run: python -c "from pathlib import Path; Path('.env').write_text('VIPER_CANARY=DO_NOT_SHIP'); Path('config/config.yaml').write_text('canary_DO_NOT_SHIP')"
      - run: docker build --tag viper-ci .
      - name: Inspect image for excluded workspace files
        run: docker run --rm --entrypoint python viper-ci -c "from pathlib import Path; assert all(not Path(p).exists() for p in ('/app/.git','/app/.venv','/app/config/config.yaml','/app/.env','/app/tests')); import waitress,scapy"
      - run: docker volume create viper-ci-reports
      - name: Sensor can write shared report volume with restricted capabilities
        run: docker run --rm --cap-drop ALL --cap-add DAC_OVERRIDE -v viper-ci-reports:/app/reports --entrypoint python viper-ci -c "from src.reporting.reporter import Reporter; Reporter('/app/reports').generate([],save=True)"
      - name: Dashboard can read sensor reports and create its own reports as UID 10001
        run: docker run --rm --user 10001:10001 --cap-drop ALL -v viper-ci-reports:/app/reports --entrypoint python viper-ci -c "from pathlib import Path; assert list(Path('/app/reports').glob('report_*.txt')); from src.reporting.reporter import Reporter; Reporter('/app/reports').generate([],save=True)"
      - if: always()
        run: docker volume rm viper-ci-reports
